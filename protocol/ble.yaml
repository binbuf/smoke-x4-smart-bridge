# protocol/ble.yaml — the BLE GATT contract.
#
# Single source of truth for the service UUID, characteristic slots, fixed and
# framed payload layouts, control ops, result statuses, flags, and enums.
# `make protocol` generates protocol/gen/records.h, records.c, and records.dart
# from this file and protocol/records.yaml.
#
# Design: docs/design/05-ble-contract.md. All multi-byte fields are
# little-endian. Every payload begins with ver = 1.

meta:
  protocol_major: 1
  protocol_minor: 0
  base_uuid: "7f9bXXXX-4c5b-4b0f-9a3d-1c2e3f405162"
  service_uuid: "7f9b0000-4c5b-4b0f-9a3d-1c2e3f405162"
  mtu_default: 23
  mtu_request: 247
  company_id: 65535
  local_name_prefix: "SmokeX4-"
  control_max_size: 16
  result_max_size: 64
  sync_frame_max_payload: 240
  sync_max_records: 64
  sync_default_records: 32

characteristics:
  - slot: "0001"
    name: info
    properties: [read]
    security: open
    payload: info
    doc: "Identity card; safe to read before bonding."
  - slot: "0002"
    name: live
    properties: [read, notify]
    security: encrypted
    payload: live
    doc: "20-byte live telemetry; fits the default MTU 23 notification."
  - slot: "0003"
    name: control
    properties: [write]
    security: authenticated
    payload: control
    doc: "Control envelope plus an op-specific body."
  - slot: "0004"
    name: result
    properties: [notify]
    security: encrypted
    payload: result
    doc: "Op result, split at MTU-3; first 5 bytes carry len."
  - slot: "0005"
    name: sync_ctrl
    properties: [write]
    security: encrypted
    payload: sync_ctrl
    doc: "Status/read/cancel request, 10 bytes."
  - slot: "0006"
    name: sync_data
    properties: [notify]
    security: encrypted
    payload: sync_frame
    doc: "Framed byte stream carrying START, RECORDS, and END."
  - slot: "0007"
    name: config
    properties: [read, write]
    security: authenticated
    payload: config
    doc: "Fixed 80-byte configuration; write replaces the whole struct."
  - slot: "0008"
    name: stats
    properties: [read]
    security: encrypted
    payload: stats
    doc: "Fixed 60-byte snapshot; re-read to refresh."

control_ops:
  set_time:
    op: 1
    body: control_set_time_body
    doc: "unix_ms plus tz_offset_min."
  forget_phone:
    op: 2
    body: null
    doc: "Remove the current phone's bond only; other bonds remain."
  factory_reset:
    op: 3
    body: null
    doc: "Wipe config, bonds, history; reboot."
  power_off:
    op: 4
    body: null
    doc: "Enter deep sleep."
  clear_history:
    op: 5
    body: null
    doc: "Erase the sample ring; keep config/pairing; new generation."
  set_billows_target:
    op: 6
    body: control_set_billows_target_body
    doc: "Reserved. Always unsupported in the MVP."
  unpair_smoke_x:
    op: 7
    body: null
    doc: "Forget the Smoke X4 pairing; keep log/config/bonds."

result_statuses:
  ok: 0
  invalid: 1
  unsupported: 2
  busy: 3
  unauthorized: 4
  failed: 5
  not_found: 6
  storage: 7

enums:
  sync_cmd:
    status: 0
    read: 1
    cancel: 2
  sync_direction:
    forward: 0
    backward: 1
  sync_status:
    ok: 0
    gap: 1
    error: 2
    busy: 3
    empty: 4
  units:
    celsius: 0
    fahrenheit: 1
  billows_mode:
    observe: 0
    control: 1

flags:
  live:
    smoke_paired: 0
    smoke_live: 1
    billows_attached: 2
    billows_output: 3 # reserved; always 0 in the MVP
    clock_valid: 4
    storage_ok: 5
    display_on: 6
    sync_active: 7
  caps:
    billows_observe: 0
    billows_control: 1 # reserved; always 0 in the MVP
    history: 2
    battery: 3
    display_config: 4
    power_off: 5
    factory_reset: 6
    config: 7
  stats:
    smoke_paired: 0
    smoke_live: 1
    advertising: 2
    connected: 3
    clock_valid: 4
    storage_ok: 5
    billows_attached: 6
    billows_control: 7 # reserved; always 0 in the MVP
  sync_frame:
    start: 0
    end: 1
    error: 2

payloads:
  info:
    size: 32
    doc: "0001 info: Read, open. Fixed 32 bytes."
    fields:
      - {name: ver, type: u8, const: 1}
      - {name: proto_major, type: u8, doc: "Must be 1."}
      - {name: proto_minor, type: u8}
      - {name: caps, type: u8, bits: caps}
      - {name: probes, type: u8, doc: "2 or 4."}
      - {name: reserved0, type: u8, const: 0}
      - {name: device_id, type: char, count: 4, doc: "ASCII hex, e.g. A4F2."}
      - {name: fw, type: char, count: 12, doc: "UTF-8, NUL-padded."}
      - {name: model, type: char, count: 8, doc: "UTF-8, NUL-padded, e.g. heltec3."}
      - {name: bonds_free, type: u8, doc: "0-4."}
      - {name: reserved1, type: u8, const: 0}

  live:
    size: 20
    doc: "0002 live: Read, Notify, encrypted. Fixed 20 bytes; MTU 23 safe."
    fields:
      - {name: ver, type: u8, const: 1}
      - {name: flags, type: u8, bits: live}
      - name: temp
        type: i16
        count: 4
        sentinel: {detached: -32768, invalid: -32767}
        doc: "Tenths of degrees F, sentinels allowed."
      - {name: seq, type: u32, doc: "Last stored sample sequence; SEQ_NONE if none."}
      - {name: billows_target_f10, type: i16, doc: "Observed target; 0 = unknown."}
      - {name: battery_pct, type: u8, doc: "0-100, 255 = unknown."}
      - {name: rssi_lora, type: i8, doc: "LoRa RSSI in dBm."}
      - {name: age_s, type: u16, doc: "Seconds since last valid Smoke X4 packet."}

  control:
    size: 3
    doc: "0003 control envelope. The op body follows immediately; total <= 16 bytes."
    fields:
      - {name: ver, type: u8, const: 1}
      - {name: op, type: u8, enum: control_op}
      - {name: op_id, type: u8, doc: "App-chosen, echoed in result."}

  control_set_time_body:
    size: 10
    doc: "control op 1 body."
    fields:
      - {name: unix_ms, type: u64}
      - {name: tz_offset_min, type: i16}

  control_set_billows_target_body:
    size: 2
    doc: "control op 6 body. Reserved; always unsupported in the MVP."
    fields:
      - {name: target_f10, type: i16}

  result:
    max_size: 64
    variable: true
    length_field: len
    doc: "0004 result: Notify, encrypted. 5-byte header plus UTF-8 detail."
    fields:
      - {name: ver, type: u8, const: 1}
      - {name: op, type: u8, enum: control_op}
      - {name: op_id, type: u8}
      - {name: status, type: u8, enum: result_status}
      - name: len
        type: u8
        doc: "Detail length in bytes, 0-59. Set by the encoder."
      - {name: detail, type: char, count: 59, doc: "UTF-8, not NUL-terminated on the wire."}

  sync_ctrl:
    size: 10
    doc: "0005 sync_ctrl: Write, encrypted."
    fields:
      - {name: ver, type: u8, const: 1}
      - {name: cmd, type: u8, enum: sync_cmd}
      - {name: direction, type: u8, enum: sync_direction}
      - {name: cursor_seq, type: u32}
      - {name: reserved0, type: u8, const: 0}
      - {name: max_records, type: u16, doc: "1-64; 0 reads as 32."}

  sync_frame:
    size: 4
    doc: "0006 sync_data frame header; payload bytes follow."
    fields:
      - {name: ver, type: u8, const: 1}
      - {name: frame_seq, type: u8, doc: "Wraps 0-255."}
      - {name: flags, type: u8, bits: sync_frame}
      - {name: len, type: u8, doc: "Payload bytes in this frame; <= 240."}

  sync_start:
    size: 20
    doc: "Logical sync stream START payload."
    fields:
      - {name: generation, type: u32}
      - {name: min_seq, type: u32}
      - {name: max_seq, type: u32}
      - {name: start_seq, type: u32, doc: "First record, or the next cursor when none."}
      - {name: count, type: u16}
      - {name: record_size, type: u8, const: 18}
      - {name: status, type: u8, enum: sync_status}

  sync_end:
    size: 13
    doc: "Logical sync stream END payload."
    fields:
      - {name: status, type: u8, enum: sync_status}
      - {name: next_seq, type: u32, doc: "Exclusive cursor for the next request."}
      - {name: min_seq, type: u32}
      - {name: max_seq, type: u32}

  config:
    size: 80
    doc: "0007 config: Read/Write, authenticated. Fixed 80 bytes."
    fields:
      - {name: ver, type: u8, const: 1}
      - {name: units, type: u8, enum: units}
      - {name: display_timeout_s, type: u16, doc: "0 = never; otherwise 30/60/120."}
      - {name: device_name, type: char, count: 16, doc: "UTF-8, NUL-padded, <=15 chars."}
      - {name: billows_target_f10, type: i16, doc: "Reserved; ignored/unwritten in the MVP."}
      - {name: billows_mode, type: u8, enum: billows_mode, doc: "Must be 0 (observe) in the MVP."}
      - {name: reserved0, type: u8, count: 57, const: 0}

  stats:
    size: 60
    doc: "0008 stats: Read, encrypted. Fixed 60 bytes."
    fields:
      - {name: ver, type: u8, const: 1}
      - {name: flags, type: u8, bits: stats}
      - {name: uptime_s, type: u32}
      - {name: records_stored, type: u32}
      - {name: records_capacity, type: u32}
      - {name: min_seq, type: u32, doc: "SEQ_NONE if empty."}
      - {name: max_seq, type: u32, doc: "SEQ_NONE if empty."}
      - {name: generation, type: u32}
      - {name: packets_ok, type: u32}
      - {name: packets_bad, type: u32}
      - {name: battery_mv, type: u16}
      - {name: battery_pct, type: u8, doc: "255 = unknown."}
      - {name: lora_rssi, type: i8}
      - {name: lora_snr, type: i8}
      - {name: reserved0, type: u8, const: 0}
      - {name: heap_free, type: u32}
      - {name: heap_min, type: u32}
      - {name: dropped_samples, type: u16}
      - {name: reserved1, type: u16, const: 0}
      - {name: oldest_unix_s, type: u32, doc: "0 if unknown."}
      - {name: newest_unix_s, type: u32, doc: "0 if unknown."}

  adv_status:
    size: 9
    doc: "Scan-response manufacturer data after the 2-byte company id."
    fields:
      - {name: ver, type: u8, const: 1}
      - {name: flags, type: u8, bits: live}
      - {name: pit_temp_f10, type: i16, doc: "P4/Billows channel; sentinels allowed."}
      - {name: battery_pct, type: u8, doc: "0-100, 255 = unknown."}
      - {name: billows_target_f10, type: i16, doc: "0 = unknown."}
      - {name: age_s, type: u8, doc: "Clamped 0-255."}
      - {name: reserved0, type: u8, const: 0}
