# protocol/records.yaml — the sample-log contract.
#
# Single source of truth for the fixed 18-byte record, the sector header,
# sentinels, flags, and log constants. `make protocol` generates
# protocol/gen/records.h, records.c, and records.dart from this file and
# protocol/ble.yaml. Those files are committed; `make protocol-check` fails if
# they drift.
#
# Design: docs/design/04-data-and-storage.md §4.2. This is NOT the legacy
# protocol/records.yaml: the legacy file is a shape reference only.

meta:
  protocol_major: 1
  protocol_minor: 0
  endianness: little
  record_version: 1
  record_size: 18
  crc16: # CRC-16/CCITT-FALSE; check("123456789") = 0x29B1
    poly: 0x1021
    init: 0xFFFF
    refin: false
    refout: false
    xorout: 0x0000
    check: 0x29B1

constants:
  TEMP_DETACHED:
    value: -32768
    type: i16
    doc: "INT16_MIN: probe detached. Surface as null, never as a temperature."
  TEMP_INVALID:
    value: -32767
    type: i16
    doc: "INT16_MIN+1: probe present but invalid/unmapped (reserved)."
  BATTERY_UNKNOWN:
    value: 255
    type: u8
    doc: "0-100 are real percentages; 255 means unknown."
  SEQ_NONE:
    value: 0xFFFFFFFF
    type: u32
    doc: "No sequence yet / empty-log min_seq and max_seq."
  SAMPLE_INTERVAL_S:
    value: 30
    type: u32
    doc: "Nominal sample cadence."
  SECTOR_SIZE:
    value: 4096
    type: u32
    doc: "Flash erase sector."
  RECORDS_PER_SECTOR:
    value: 225
    type: u32
    doc: "(4096 - 32 header) / 18."
  RECORD_CAPACITY:
    value: 338400
    type: u32
    doc: "1504 sectors x 225 records."
  LOG_PARTITION_BYTES:
    value: 6160384
    type: u32
    doc: "5.875 MiB dedicated raw partition."
  SECTOR_HEADER_MAGIC:
    value: "SX4L"
    type: char
    count: 4
  SECTOR_HEADER_VERSION:
    value: 1
    type: u8

flags:
  record:
    probe1_attached: 0
    probe2_attached: 1
    probe3_attached: 2
    probe4_attached: 3
    billows_attached: 4
    clock_valid: 5
    source_celsius: 6
    new_alarm: 7

records:
  sample_rec:
    size: 18
    doc: "One valid Smoke X4 state packet: fixed, packed, little-endian."
    fields:
      - name: seq
        type: u24
        doc: "Monotonic sample id. All code uses a uint32 in memory."
      - name: unix_s
        type: u32
        doc: "UTC seconds; 0 when the clock was not set."
      - name: temp
        type: i16
        count: 4
        sentinel:
          detached: -32768
          invalid: -32767
        doc: "Tenths of degrees F, one per probe, in probe order."
      - name: flags
        type: u8
        bits: record
        doc: "Probe attached bits, Billows, clock, source units, new_alarm."
      - name: crc16
        type: u16
        crc:
          kind: crc16
          over: [0, 16] # end-exclusive: bytes 0..15
        doc: "CRC-16/CCITT-FALSE over the preceding 16 bytes."

  sector_header:
    size: 16
    doc: "One of two identical copies at the start of every flash sector."
    fields:
      - name: magic
        type: char
        count: 4
        const: "SX4L"
      - name: version
        type: u8
        const: 1
      - name: flags
        type: u8
        const: 0
        doc: "Reserved; must be 0."
      - name: first_seq
        type: u24
        doc: "Sequence of the first record written in the sector."
      - name: generation
        type: u32
        doc: "Random log generation; not a counter."
      - name: crc16
        type: u16
        crc:
          kind: crc16
          over: [0, 13]
      - name: reserved
        type: u8
        const: 0
