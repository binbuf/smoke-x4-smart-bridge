# T1.5 — the host unit-test suite: plain CMake + CTest, no ESP-IDF, no
# hardware, warnings as errors, with coverage (design 10 §10.5–10.6).
name: firmware-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with coverage
        run: >
          cmake -S firmware/test -B firmware/test/build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="--coverage"

      - name: Build
        run: cmake --build firmware/test/build

      - name: Run
        run: ctest --test-dir firmware/test/build --output-on-failure

      # F11a.2: the .fb goldens are the gate (byte-exact, in the C test
      # above). These PNGs are how a human reviews a font or layout change
      # on the PR — rendered whether the comparison passed or failed,
      # because a failing golden is exactly when you want the picture.
      - name: Render OLED previews
        if: always()
        run: |
          python3 tools/oled/render_oled_preview.py \
            --out-dir firmware/test/build/oled-render \
            firmware/test/build/oled-render/*.fb || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oled-previews
          path: firmware/test/build/oled-render/*.png
          if-no-files-found: warn

      - name: Coverage summary
        run: |
          pip install --quiet gcovr
          gcovr --root firmware --filter 'firmware/(main|components)/' \
                --print-summary --xml coverage.xml
        continue-on-error: false

      - uses: actions/upload-artifact@v4
        with:
          name: host-test-coverage
          path: coverage.xml
