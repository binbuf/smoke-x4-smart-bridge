# Smoke X4 Smart Bridge — slim companion app (Android-first, BLE-only).
#
# Deliberately small: temperatures, graph, history, and a cook start time. No
# Wi-Fi/SoftAP, MQTT, OTA, alarms, notifications, marks, probe roles/targets,
# or settings tree. The bridge records continuously and answers full history
# over BLE (v1.1 `history_ctrl`/`history_data`), so the app is a pure client.
name: smoke_bridge
description: "Slim companion app for the Smoke X4 smart bridge — live temperatures, graph and history over Bluetooth."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # `@immutable` for `domain/`, which may not import Flutter (layering rule).
  meta: ^1.18.0
  # Charts
  fl_chart: ^1.2.0
  # BLE GATT client (hides behind `BleGattClient`).
  flutter_blue_plus: ^2.3.10
  # The persistent sample cache.
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  # Prefs (last bridge id).
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The pure-Dart domain is host-testable without a binding, so `lib/domain`
  # tests use `package:test` and run under both `dart test test/domain` and
  # `flutter test`. The rest of the suite stays on `flutter_test`.
  test: ^1.31.0

  flutter_lints: ^6.0.0
  # Codegen
  build_runner: ^2.15.1
  # Drift codegen + a raw handle for the host-test harness.
  drift_dev: ^2.34.0
  sqlite3: ^3.5.0

flutter:
  uses-material-design: true

  # The two variable fonts actually used ship as assets, never fetched. Both
  # are SIL OFL 1.1; the licences sit beside them.
  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-JetBrainsMono.txt

  fonts:
    - family: Inter
      fonts:
        - asset: "assets/fonts/Inter[opsz,wght].ttf"
    - family: JetBrainsMono
      fonts:
        - asset: "assets/fonts/JetBrainsMono[wght].ttf"