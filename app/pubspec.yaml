# Smoke X4 Smart Bridge — Flutter app (Android-only for v1).
#
# Package set is the design 08 §8.2 table, pinned via the committed
# pubspec.lock (the root .gitignore un-ignores app/pubspec.lock).
#
# Deliberately NOT used: any ESP provisioning package. We speak our own GATT
# protocol (D1); those packages assume Espressif's protobuf scheme.
#
# Note: `freezed` is at 3.2.6-dev.1 because the latest stable (3.2.5) wants
# analyzer <11 while riverpod_generator ^4.0.4 wants analyzer ^12 — the dev
# build is the only version compatible with the rest of the §8.2 set.
name: smoke_bridge
description: "Companion app for the Smoke X4 smart bridge — live cook telemetry, history, and alarms."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # `@immutable` for `domain/`, which may not import Flutter (the layering
  # rule in 10 §10.4 — `foundation.dart` would re-export it and break that).
  meta: ^1.18.0
  # BLE
  flutter_blue_plus: ^2.3.10
  # Discovery — nsd, NOT multicast_dns (long-standing Android bug, flutter#155499)
  nsd: ^5.0.1
  # HTTP / WebSocket
  dio: ^5.10.0
  web_socket_channel: ^3.0.3
  # Local DB
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  # Charts
  fl_chart: ^1.2.0
  # Notifications / foreground service
  flutter_local_notifications: ^22.1.0
  flutter_foreground_task: ^10.0.0
  # Filesystem — drift's on-device file lives in the documents directory.
  # Not in the §8.2 table because §8.2 lists the interesting choices;
  # this pair is what `drift` needs to point at a real file on Android.
  path_provider: ^2.1.5
  path: ^1.9.1
  # Prefs / logging / routing
  shared_preferences: ^2.5.5
  logger: ^2.7.0
  go_router: ^17.3.0
  # A24.2 — runtime permissions + platform seams (design 13 §13.2.0). Appended,
  # not woven into §8.2's table: these are the on-device wiring the preflight
  # gate needs (runtime request + OS settings deep-links) and share_plus backs
  # the export sheet. flutter_blue_plus still requests BLE at scan time; these
  # let the primer/permission gate become real ahead of it.
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  share_plus: ^10.0.0
  # newapp §C.5 — the OTA file picker. First-party, and needs no storage
  # permission: the Storage Access Framework grants per-file access at pick
  # time, which is exactly the scope wanted for "choose one .bin".
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Codegen
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  drift_dev: ^2.34.0
  # The v1→v2 migration test opens a raw database to assert the stepped
  # migration against a real file, rather than trusting drift's own harness.
  sqlite3: ^3.5.0

flutter:
  uses-material-design: true

  # Design 14 §14.5. Bundled as assets, never fetched: the app must render
  # identically on a phone joined to the bridge's own AP with no internet at
  # all (`bindProcessToNetwork` removes NET_CAPABILITY_INTERNET by design,
  # 05 §5.8.1), and a golden that depends on a font download is a golden that
  # fails in CI. All three are SIL OFL 1.1; the licences sit beside them and
  # are registered with LicenseRegistry in bootstrap().
  #
  # Measured 1.64 MB of TTF against 14 §14.5's ≤1.2 MB budget — over, and
  # Inter is 876 KB of it. Subsetting is A19.2b; `--tree-shake-icons` does not
  # touch fonts.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo[wdth,wght].ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter[opsz,wght].ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf
