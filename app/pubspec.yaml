# Smoke X4 Smart Bridge — Flutter app (Android-only for v1).
#
# Package set is the design 08 §8.2 table, pinned via the committed
# pubspec.lock (the root .gitignore un-ignores app/pubspec.lock).
#
# Deliberately NOT used: any ESP provisioning package. We speak our own GATT
# protocol (D1); those packages assume Espressif's protobuf scheme.
#
# Note: `freezed` is at 3.2.6-dev.1 because the latest stable (3.2.5) wants
# analyzer <11 while riverpod_generator ^4.0.4 wants analyzer ^12 — the dev
# build is the only version compatible with the rest of the §8.2 set.
name: smoke_bridge
description: "Companion app for the Smoke X4 smart bridge — live cook telemetry, history, and alarms."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # BLE
  flutter_blue_plus: ^2.3.10
  # Discovery — nsd, NOT multicast_dns (long-standing Android bug, flutter#155499)
  nsd: ^5.0.1
  # HTTP / WebSocket
  dio: ^5.10.0
  web_socket_channel: ^3.0.3
  # Local DB
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  # Charts
  fl_chart: ^1.2.0
  # Notifications / foreground service
  flutter_local_notifications: ^22.1.0
  flutter_foreground_task: ^10.0.0
  # Filesystem — drift's on-device file lives in the documents directory.
  # Not in the §8.2 table because §8.2 lists the interesting choices;
  # this pair is what `drift` needs to point at a real file on Android.
  path_provider: ^2.1.5
  path: ^1.9.1
  # Prefs / logging / routing
  shared_preferences: ^2.5.5
  logger: ^2.7.0
  go_router: ^17.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Codegen
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
