# N0.3 — strict lints for the new app.
#
# This includes the Flutter recommended set and tightens it. Two structural
# rules (domain purity, design statelessness) cannot be expressed here, so
# they live as tests under test/domain and test/design.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Codegen output is machine-written and excluded from lint, but it *is*
    # committed and its freshness is checked by CI (see app.yml).
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_redundant_argument_values
    - await_only_futures
    - directives_ordering
    - eol_at_end_of_file
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
    - use_string_buffers