# Pre-commit hooks (T1.3), extended from the reference's config at
# docs/reference/smoke-x-receiver/.pre-commit-config.yaml per design 10 §10.7.
#
# Deltas from the reference:
#   - eslint DROPPED: it targets web_ui/, which this repo does not have
#     (decision D13 — the fallback web UI is a post-MVP question).
#   - ADDED: dart format, a protocol/gen freshness check (protogen --check),
#     and YAML/JSON validation.
#   - docs/reference/ is excluded globally: it is a read-only vendor snapshot
#     (see docs/reference/PROVENANCE.md) and no hook may ever rewrite it.
#   - Generated codecs (protocol/gen/, *.g.dart) are excluded from formatters;
#     their freshness is enforced by protogen-check instead.

exclude: ^docs/reference/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-added-large-files # prevents giant files from being committed.
      - id: check-case-conflict # checks for files that would conflict in case-insensitive filesystems.
      - id: check-merge-conflict # checks for files that contain merge conflict strings.
      - id: detect-private-key # detects the presence of private keys.
      - id: end-of-file-fixer # ensures that a file is either empty, or ends with one newline.
        exclude: ^protocol/gen/|\.g\.dart$
      - id: mixed-line-ending # replaces or checks mixed line ending.
        args: [--fix=lf]
      - id: trailing-whitespace # trims trailing whitespace.
        exclude: ^protocol/gen/|\.g\.dart$
      - id: check-yaml # validates yaml syntax.
        exclude: ^\.clang-format$ # multi-document YAML (clang's own format)
      - id: check-json # validates json syntax.

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        files: \.(css|less|html|json|markdown|md|yaml|yml)$
        exclude: ^(protocol/gen/|app/)|\.g\.dart$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v14.0.6
    hooks:
      - id: clang-format
        files: ^firmware/
        exclude: ^protocol/gen/

  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format --output=none --set-exit-if-changed app/lib app/test tools
        language: system
        files: \.dart$
        exclude: ^protocol/gen/|\.g\.dart$
        pass_filenames: false
      - id: protogen-check
        name: protocol/gen freshness (dart run protogen --check)
        entry: dart run protogen --check
        language: system
        pass_filenames: false
        always_run: true
