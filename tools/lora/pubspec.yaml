name: lora
description: >-
  Capture tooling for real Smoke X traffic. bin/normalize.dart turns an
  ESP-IDF monitor log from the reference firmware into committed .loralog
  fixtures plus a protocol-question report (V2.1/V2.2). pull.py/replay.py
  arrive with T4 in M1 once our firmware serves /api/v1/debug/*.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
dependencies:
  args: ^2.6.0
dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
