name: flash
description: >-
  T5 — the merged-image builder, the esp-web-tools manifest, and the esptool command,
  all computed from the build's own flasher_args.json rather than transcribed. The
  reference's merge offsets do NOT transfer: our partition table is a different table
  on a different flash size (03 §3.5).
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
dependencies:
  args: ^2.6.0
  bridge_protocol:
    path: ../bridge_protocol
dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
