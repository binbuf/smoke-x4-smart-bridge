name: soak
description: >-
  V3 — the 24-hour soak recorder and the report that closes the heap question.
  Polls /status and /debug/tasks, holds a WebSocket, appends one NDJSON line per
  sample to a file that survives the tool being killed, and evaluates the four
  criteria fixed in docs/tasks/M6-hardening-and-release.md BEFORE the run.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
dependencies:
  args: ^2.6.0
dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
